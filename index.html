<script>
/* Settle the theme before the first paint, or the page flashes the wrong one.
   Stored choice wins; otherwise follow the device. */
(function () {
  var t;
  try { t = localStorage.getItem('tripbudget.theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.style.background = (t === 'dark' ? '#14110C' : '#F2EDE3');
})();
</script>
